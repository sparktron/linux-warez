name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build-tui:
    name: Build TUI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: installer-tui
      # gnu libstd references GLIBC_2.39 (pidfd_spawnp). The musl target
      # is what ./build-release.sh ships, and it runs on 22.04 and 24.04.
      - name: cargo build --release (static musl)
        working-directory: installer-tui
        run: cargo build --release --target x86_64-unknown-linux-musl
      - name: Reject a glibc-linked installer
        working-directory: installer-tui
        run: |
          bin=target/x86_64-unknown-linux-musl/release/installer-tui
          file -b "$bin" | grep -Eq 'statically linked|static-pie'
          if ldd "$bin" 2>&1 | grep -q 'libc.so'; then
            echo "binary links glibc" >&2
            exit 1
          fi
          "$bin" --dump-json >/dev/null

  lint-shell:
    name: Lint shell scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax check
        run: |
          bash -n install-all.sh
          bash -n gather-software-inventory.sh
      - name: ShellCheck
        # Pinned: @master let an upstream change break this job with no commit
        # here. severity=warning is the floor this repo actually enforces --
        # the style-level notes (SC2162, SC2012, SC2016, SC1091, and the
        # deliberate word-split at install-all.sh:83) are not defects.
        uses: ludeeus/action-shellcheck@2.0.0  # 00cae500b08a931fb5698e11e79bfbd38e612a38
        with:
          scandir: '.'
          severity: warning
